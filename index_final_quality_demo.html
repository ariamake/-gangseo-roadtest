<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gangseo Road Test · Final Quality Demo</title>
<style>
:root{--glass:rgba(15,22,28,.72);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bc9e8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:0 2px 7px rgba(0,0,0,.55)}
#status{position:absolute;left:18px;right:18px;top:max(14px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:900;letter-spacing:.4px}
#score{font-size:21px}
#speed{position:absolute;top:58px;left:50%;transform:translateX(-50%);padding:9px 15px;border-radius:999px;background:rgba(16,24,30,.78);border:1px solid var(--line);font-size:17px;font-weight:900;min-width:88px;text-align:center;backdrop-filter:blur(10px)}
#nav{position:absolute;top:106px;left:50%;transform:translateX(-50%);width:min(78vw,390px);padding:13px 15px;border-radius:18px;background:rgba(15,23,30,.82);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18);backdrop-filter:blur(12px)}
#nav strong{display:block;font-size:17px;margin-bottom:3px}
#nav small{font-size:12px;color:#dbe6ee}
#banner{position:absolute;left:50%;bottom:188px;transform:translateX(-50%);padding:7px 11px;border-radius:11px;background:rgba(0,0,0,.45);font-size:11px;color:#eef7fc;white-space:nowrap}
#controls{position:fixed;inset:0;pointer-events:none}
#wheelWrap{pointer-events:auto;position:absolute;left:14px;bottom:max(18px,calc(env(safe-area-inset-bottom) + 10px));width:136px;height:136px;touch-action:none}
#wheel{position:relative;width:100%;height:100%;border-radius:50%;border:10px solid rgba(247,249,251,.9);background:rgba(20,28,34,.38);box-shadow:inset 0 0 0 3px rgba(0,0,0,.22),0 12px 28px rgba(0,0,0,.28)}
#wheel:before,#wheel:after{content:"";position:absolute;left:50%;top:50%;height:8px;width:51px;border-radius:8px;background:rgba(247,249,251,.92);transform-origin:0 50%}
#wheel:before{transform:rotate(25deg)}#wheel:after{transform:rotate(155deg)}
#hub{position:absolute;left:50%;top:50%;width:38px;height:38px;transform:translate(-50%,-50%);border-radius:50%;background:#202930;border:4px solid #f3f6f8}
#mark{position:absolute;left:50%;top:2px;width:5px;height:22px;transform:translateX(-50%);background:#fff;border-radius:4px}
#pedals{pointer-events:auto;position:absolute;right:14px;bottom:max(20px,calc(env(safe-area-inset-bottom) + 12px));display:flex;flex-direction:column-reverse;gap:10px}
.pedal{width:90px;height:62px;border:1px solid rgba(255,255,255,.2);border-radius:19px;background:rgba(28,36,42,.56);color:#fff;font-size:16px;font-weight:900;box-shadow:0 9px 24px rgba(0,0,0,.2);backdrop-filter:blur(9px)}
.pedal.active{background:rgba(255,255,255,.35);transform:scale(.98)}
#signals{pointer-events:auto;position:absolute;left:50%;bottom:max(26px,calc(env(safe-area-inset-bottom) + 18px));transform:translateX(-50%);display:flex;gap:8px}
.sig{width:54px;height:39px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(10,15,18,.62);color:#fff;font-size:18px}
.sig.active{background:#f0b62c;color:#171717}
#toast{position:fixed;left:50%;top:47%;transform:translate(-50%,-50%);padding:13px 17px;border-radius:14px;background:rgba(0,0,0,.72);color:#fff;font-weight:900;font-size:17px;opacity:0;transition:.18s;pointer-events:none}
#toast.show{opacity:1}
#start{position:fixed;inset:0;z-index:20;background:linear-gradient(180deg,rgba(135,194,232,.95) 0 44%,rgba(81,110,79,.96) 44% 100%);display:flex;align-items:center;justify-content:center;padding:24px}
#card{width:min(92vw,430px);padding:25px 22px 22px;border-radius:26px;background:rgba(11,18,24,.91);color:#fff;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.09)}
#card .eyebrow{font-size:12px;letter-spacing:1.5px;color:#a9cfe6;font-weight:900;margin-bottom:7px}
#card h1{margin:0;font-size:29px;line-height:1.05}
#card p{margin:14px 0 20px;line-height:1.5;color:#d5e2ea;font-size:14px}
#startBtn{width:100%;padding:15px;border:0;border-radius:16px;background:#f5f7f8;color:#152028;font-weight:900;font-size:17px}
#quality{margin-top:13px;font-size:11px;color:#94a9b5}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="status"><span>A COURSE · QUALITY DEMO</span><span id="score">100점</span></div>
  <div id="speed">0 km/h</div>
  <div id="nav"><strong id="navTitle">출발 후 직진하세요</strong><small id="navSub">교차로 접근 시 신호와 차로를 확인하세요</small></div>
  <div id="banner">FINAL QUALITY DEMO · 모바일 웹에서 가능한 목표 비주얼</div>
</div>
<div id="controls">
  <div id="wheelWrap"><div id="wheel"><div id="mark"></div><div id="hub"></div></div></div>
  <div id="signals"><button class="sig" id="sigL">◀</button><button class="sig" id="sigR">▶</button></div>
  <div id="pedals"><button class="pedal" id="gas">ACCEL</button><button class="pedal" id="brake">BRAKE</button></div>
</div>
<div id="toast"></div>
<div id="start"><div id="card">
  <div class="eyebrow">GANGSEO ROAD TEST</div>
  <h1>Final Quality Demo</h1>
  <p>전체 A코스를 만들기 전에, 현재 방식으로 도달 가능한 최종 느낌을 먼저 검증합니다.<br>도로·교차로·NPC 차량·도시 오브젝트·신호·카메라·주행감을 한 화면에 담았습니다.</p>
  <button id="startBtn">품질 데모 시작</button>
  <div id="quality">※ 실제 코스 제작 전 비주얼·주행감 검증용</div>
</div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const speedEl=document.getElementById('speed'),scoreEl=document.getElementById('score'),toast=document.getElementById('toast');
const navTitle=document.getElementById('navTitle'),navSub=document.getElementById('navSub');
const start=document.getElementById('start'),startBtn=document.getElementById('startBtn');
const sigL=document.getElementById('sigL'),sigR=document.getElementById('sigR');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
const car={x:0,y:690,a:-Math.PI/2,speed:0,steer:0};
const keys={gas:false,brake:false};
let running=false,last=performance.now(),score=100,signal=0,stage=0,off=false;
let wheelAngle=0,wheelTarget=0,wheelDragging=false,pid=null;
const wheel=document.getElementById('wheel'),wheelWrap=document.getElementById('wheelWrap'),MAXW=145;
function angleAt(e){const r=wheelWrap.getBoundingClientRect();return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)*180/Math.PI}
let a0=0,w0=0;
wheelWrap.addEventListener('pointerdown',e=>{e.preventDefault();wheelDragging=true;pid=e.pointerId;wheelWrap.setPointerCapture(pid);a0=angleAt(e);w0=wheelAngle});
wheelWrap.addEventListener('pointermove',e=>{if(!wheelDragging||e.pointerId!==pid)return;let d=angleAt(e)-a0;while(d>180)d-=360;while(d<-180)d+=360;wheelTarget=Math.max(-MAXW,Math.min(MAXW,w0+d));wheelAngle=wheelTarget;wheel.style.transform=`rotate(${wheelAngle}deg)`});
function release(e){if(!wheelDragging||(e&&e.pointerId!==pid))return;wheelDragging=false;pid=null;wheelTarget=0}
wheelWrap.addEventListener('pointerup',release);wheelWrap.addEventListener('pointercancel',release);
function bind(id,key){const b=document.getElementById(id);const on=e=>{e.preventDefault();keys[key]=true;b.classList.add('active')};const off=e=>{e.preventDefault();keys[key]=false;b.classList.remove('active')};b.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,off))}
bind('gas','gas');bind('brake','brake');
function setSig(v){signal=signal===v?0:v;sigL.classList.toggle('active',signal===-1);sigR.classList.toggle('active',signal===1)}
sigL.onclick=()=>setSig(-1);sigR.onclick=()=>setSig(1);
startBtn.onclick=()=>{start.style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)};
function pop(s){toast.textContent=s;toast.classList.add('show');clearTimeout(pop.t);pop.t=setTimeout(()=>toast.classList.remove('show'),1000)}
function deduct(n,s){score=Math.max(0,score-n);scoreEl.textContent=score+'점';pop(`-${n}점 · ${s}`)}
const roadW=160;
const buildings=[{x:-300,y:460,w:150,d:210,h:85,c:'#a47758',r:'#d2a177'},{x:305,y:260,w:160,d:180,h:68,c:'#82735f',r:'#b7a083'},{x:-330,y:-50,w:135,d:190,h:58,c:'#8b6d59',r:'#bc9071'},{x:360,y:-330,w:190,d:150,h:74,c:'#6f716f',r:'#999d9a'},{x:585,y:-135,w:155,d:220,h:60,c:'#937861',r:'#c49b78'}];
const npcs=[{x:-52,y:320,a:-Math.PI/2,s:22,c:'#d75144'},{x:52,y:-420,a:Math.PI/2,s:18,c:'#445e85'},{x:340,y:-120,a:0,s:17,c:'#e4e6e7'},{x:575,y:-78,a:Math.PI,s:14,c:'#d5aa3e'}];
function update(dt){
 if(keys.gas)car.speed+=48*dt;if(keys.brake)car.speed-=90*dt;if(!keys.gas&&!keys.brake)car.speed=Math.max(0,car.speed-11*dt);car.speed=Math.max(0,Math.min(68,car.speed));
 if(!wheelDragging){wheelAngle+=(wheelTarget-wheelAngle)*Math.min(1,7*dt);if(Math.abs(wheelAngle)<.12)wheelAngle=0;wheel.style.transform=`rotate(${wheelAngle}deg)`}
 const st=wheelAngle/MAXW;car.steer+=(st-car.steer)*Math.min(1,7*dt);car.a+=car.steer*1.03*Math.min(1,car.speed/18)*dt;car.x+=Math.cos(car.a)*car.speed*1.64*dt;car.y+=Math.sin(car.a)*car.speed*1.64*dt;speedEl.textContent=Math.round(car.speed)+' km/h';
 for(const n of npcs){n.x+=Math.cos(n.a)*n.s*dt;n.y+=Math.sin(n.a)*n.s*dt;if(n.y<-760)n.y=720;if(n.y>760)n.y=-720;if(n.x>820)n.x=-60;if(n.x<-220)n.x=760}
 if(stage===0&&car.y<400){stage=1;navTitle.textContent='150m 앞 교차로';navSub.textContent='우측 차로 유지 · 신호 확인'}
 if(stage===1&&car.y<145){stage=2;navTitle.textContent='교차로 통과 후 우회전 준비';navSub.textContent='우측 방향지시등을 사용하세요'}
 if(stage===2&&car.y<25){stage=3;if(signal!==1)deduct(5,'방향지시등 미사용');navTitle.textContent='우회전하세요';navSub.textContent='교차로 진입 속도를 낮추세요'}
 if(stage===3&&car.x>105&&Math.abs(car.y+115)<105){stage=4;signal=0;sigR.classList.remove('active');navTitle.textContent='우회전 완료';navSub.textContent='전방 차량과 안전거리를 유지하세요';pop('교차로 통과')}
 let d=999;if(car.y>-155)d=Math.min(d,Math.abs(car.x));if(car.x>-35)d=Math.min(d,Math.abs(car.y+115));if(d>roadW-15&&!off){off=true;deduct(10,'차로 이탈')}if(d<roadW-40)off=false;
}
function local(wx,wy){const dx=wx-car.x,dy=wy-car.y;const f={x:Math.cos(car.a),y:Math.sin(car.a)},r={x:-Math.sin(car.a),y:Math.cos(car.a)};return{x:dx*r.x+dy*r.y,z:dx*f.x+dy*f.y}}
function proj(wx,wy,h=0){const p=local(wx,wy),f=Math.min(W,H)*1.42,zz=Math.max(38,p.z+260),s=f/zz;return{x:W/2+p.x*s,y:H*.565-(p.z*.34+h)*s,s,z:p.z}}
function poly(points,fill){const ps=points.map(p=>proj(p[0],p[1],p[2]||0));ctx.beginPath();ps.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function line(a,b,color,w=3){const p=proj(a[0],a[1],a[2]||0),q=proj(b[0],b[1],b[2]||0);ctx.strokeStyle=color;ctx.lineWidth=Math.max(1,w*(p.s+q.s)/2);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}
function shadowEllipse(wx,wy,rx,ry,alpha=.16){const p=proj(wx,wy,0);ctx.fillStyle=`rgba(0,0,0,${alpha})`;ctx.beginPath();ctx.ellipse(p.x+7*p.s,p.y+5*p.s,rx*p.s,ry*p.s,0,0,Math.PI*2);ctx.fill()}
function shade(hex,amt){let n=parseInt(hex.slice(1),16),r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('')}
function box(o){const {x,y,w,d,h,c,r}=o,A=[x-w/2,y-d/2],B=[x+w/2,y-d/2],C=[x+w/2,y+d/2],D=[x-w/2,y+d/2];shadowEllipse(x,y,w*.55,d*.45,.12);poly([[...D,0],[...C,0],[...C,h],[...D,h]],shade(c,-22));poly([[...B,0],[...C,0],[...C,h],[...B,h]],c);poly([[...A,h],[...B,h],[...C,h],[...D,h]],r)}
function tree(x,y,s=1){const p=proj(x,y,0),q=proj(x,y,42*s);shadowEllipse(x,y,17*s,10*s,.12);ctx.strokeStyle='#665039';ctx.lineWidth=Math.max(2,5*p.s*s);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();for(const [ox,oy,rr,cl] of [[0,0,16,'#347b48'],[-7,-5,10,'#45935a'],[8,-3,11,'#2d6d40']]){ctx.fillStyle=cl;ctx.beginPath();ctx.arc(q.x+ox*q.s*s,q.y+oy*q.s*s,Math.max(4,rr*q.s*s),0,Math.PI*2);ctx.fill()}}
function pole(x,y,green=true){const p=proj(x,y,0),q=proj(x,y,60);ctx.strokeStyle='#3d4245';ctx.lineWidth=Math.max(2,4*p.s);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.fillStyle='#202426';ctx.fillRect(q.x-8*q.s,q.y-17*q.s,16*q.s,33*q.s);['#ef4c45','#e6bd3b','#58ca67'].forEach((cl,i)=>{ctx.fillStyle=(green&&i===2)||(!green&&i===0)?cl:'#384044';ctx.beginPath();ctx.arc(q.x,q.y+(-10+i*10)*q.s,3*q.s,0,Math.PI*2);ctx.fill()})}
function npc(n){const p=proj(n.x,n.y,0);if(p.z<-35||p.z>650)return;const s=Math.max(.25,p.s);shadowEllipse(n.x,n.y,20,32,.18);ctx.save();ctx.translate(p.x,p.y-13*s);ctx.rotate(n.a-car.a+Math.PI/2);ctx.scale(s,s);ctx.fillStyle=n.c;ctx.fillRect(-14,-26,28,52);ctx.fillStyle='#b9d4e4';ctx.fillRect(-10,-17,20,15);ctx.fillStyle='#222b31';ctx.fillRect(-10,5,20,10);ctx.fillStyle='#111';ctx.fillRect(-17,-17,4,14);ctx.fillRect(13,-17,4,14);ctx.fillRect(-17,8,4,13);ctx.fillRect(13,8,4,13);ctx.restore()}
function road(){poly([[-1200,-1200],[1200,-1200],[1200,1200],[-1200,1200]],'#667e68');poly([[-roadW,-1000],[roadW,-1000],[roadW,1000],[-roadW,1000]],'#34393d');poly([[-85,-280],[900,-280],[900,50],[-85,50]],'#34393d');poly([[-roadW-30,-1000],[-roadW,-1000],[-roadW,1000],[-roadW-30,1000]],'#b4aa9b');poly([[roadW,-1000],[roadW+30,-1000],[roadW+30,60],[roadW,60]],'#b4aa9b');poly([[-85,-310],[900,-310],[900,-280],[-85,-280]],'#b4aa9b');poly([[160,50],[900,50],[900,80],[160,80]],'#b4aa9b');line([-roadW+7,-1000],[-roadW+7,1000],'#efd44c',4);line([roadW-7,-1000],[roadW-7,60],'#efd44c',4);line([-80,-273],[900,-273],'#efd44c',4);line([160,43],[900,43],'#efd44c',4);for(const x of [-54,54])for(let y=-900;y<900;y+=78){if(y>-300&&y<80)continue;line([x,y],[x,y+38],'#f6f6f6',3)}for(const yy of [-170,-65])for(let x=85;x<850;x+=78)line([x,yy],[x+38,yy],'#f6f6f6',3);line([-135,58],[135,58],'#fff',6);for(let x=-125;x<130;x+=28)line([x,86],[x+14,86],'#fff',12)}
function drawPlayer(){const cx=W/2,cy=H*.71;ctx.save();ctx.translate(cx,cy);ctx.rotate(car.steer*.10);ctx.scale(.92,.92);ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(7,18,28,44,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c3ccd2';ctx.beginPath();ctx.moveTo(-22,-29);ctx.lineTo(22,-29);ctx.lineTo(27,31);ctx.lineTo(-18,38);ctx.closePath();ctx.fill();ctx.fillStyle='#f0f3f5';ctx.beginPath();ctx.moveTo(-22,-37);ctx.lineTo(18,-37);ctx.lineTo(22,25);ctx.lineTo(-22,31);ctx.closePath();ctx.fill();ctx.fillStyle='#9ec4db';ctx.beginPath();ctx.moveTo(-14,-26);ctx.lineTo(12,-26);ctx.lineTo(15,-5);ctx.lineTo(-15,-4);ctx.closePath();ctx.fill();ctx.fillStyle='#202a31';ctx.fillRect(-15,7,30,15);ctx.fillStyle='#111';ctx.fillRect(-27,-20,7,18);ctx.fillRect(20,-20,7,18);ctx.fillRect(-27,12,7,17);ctx.fillRect(20,12,7,17);ctx.fillStyle=signal===1?'#ffbd2a':'#727b80';ctx.fillRect(15,-34,6,7);ctx.fillStyle=signal===-1?'#ffbd2a':'#727b80';ctx.fillRect(-22,-34,6,7);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H*.33);sky.addColorStop(0,'#86bfe5');sky.addColorStop(1,'#d5eaf5');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.34);ctx.fillStyle='#667e68';ctx.fillRect(0,H*.28,W,H*.72);road();for(const b of buildings)box(b);for(let y=600;y>-760;y-=125){tree(-240,y,.95);if(y<40||y>180)tree(235,y,.92)}for(let x=260;x<840;x+=120){tree(x,-345,.9);tree(x,95,.9)}pole(-185,18,true);pole(185,-250,true);for(const n of npcs)npc(n);drawPlayer();const vg=ctx.createRadialGradient(W/2,H*.55,Math.min(W,H)*.3,W/2,H*.55,Math.max(W,H)*.8);vg.addColorStop(.58,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.18)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H)}
function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
draw();
</script>
</body>
</html>
